<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logs - Hermes</title>
  <link rel="stylesheet" href="/bots/styles.css" />
</head>
<body>
  <div id="shell">
    <nav id="shell-nav"></nav>
    <div id="shell-page">
      <div class="page">
        <div class="page-header">
          <div>
            <h1>Logs</h1>
            <p>Tail of the agent log.</p>
          </div>
          <button id="refresh-logs-btn" class="btn btn-icon-label"></button>
        </div>
        <div class="page-body">
          <pre id="logs-view" style="background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; font-size:0.78rem; font-family:ui-monospace,monospace; white-space:pre-wrap; word-break:break-all; max-height:100%; overflow-y:auto;"></pre>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/bots/icons.js"></script>
  <script src="/bots/shell.js"></script>
  <script src="/bots/common.js"></script>
  <script src="/bots/logs.js"></script>
</body>
</html>
