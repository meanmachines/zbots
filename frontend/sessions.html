<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions - Hermes</title>
  <link rel="stylesheet" href="/bots/styles.css" />
</head>
<body>
  <div id="shell">
    <nav id="shell-nav"></nav>
    <div id="shell-page">
      <div class="page">
        <div class="page-header">
          <div>
            <h1>Sessions</h1>
            <p>Recent conversations across every profile.</p>
          </div>
        </div>
        <div class="page-body">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Profile</th>
                <th>Model</th>
                <th>Messages</th>
                <th>Last active</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="sessions-body"></tbody>
          </table>
          <div id="sessions-empty" class="empty-state" style="display:none;">No sessions found.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/bots/icons.js"></script>
  <script src="/bots/shell.js"></script>
  <script src="/bots/common.js"></script>
  <script src="/bots/sessions.js"></script>
</body>
</html>
