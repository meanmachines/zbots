<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files - Hermes</title>
  <link rel="stylesheet" href="/bots/styles.css" />
</head>
<body>
  <div id="shell">
    <nav id="shell-nav"></nav>
    <div id="shell-page">
      <div class="page">
        <div class="page-header">
          <div>
            <h1>Files</h1>
            <p id="files-path"></p>
          </div>
          <button id="new-folder-btn" class="btn btn-icon-label"></button>
        </div>
        <div class="page-body">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th></th></tr></thead>
            <tbody id="files-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="new-folder-modal-backdrop">
    <div class="modal">
      <h2>New folder</h2>
      <form id="new-folder-form">
        <div class="field">
          <label for="new-folder-name">Name</label>
          <input id="new-folder-name" type="text" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="new-folder-cancel">Cancel</button>
          <button type="submit" class="btn primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="viewer-modal-backdrop">
    <div class="modal modal-wide">
      <h2 id="viewer-title"></h2>
      <pre id="viewer-body" class="viewer-body"></pre>
      <div class="modal-actions">
        <a id="viewer-download" class="btn" style="display:none;">Download</a>
        <button type="button" class="btn primary" id="viewer-close">Close</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/bots/icons.js"></script>
  <script src="/bots/shell.js"></script>
  <script src="/bots/common.js"></script>
  <script src="/bots/files.js"></script>
</body>
</html>
