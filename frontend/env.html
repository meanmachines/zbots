<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Environment - Hermes</title>
  <link rel="stylesheet" href="/bots/styles.css" />
</head>
<body>
  <div id="shell">
    <nav id="shell-nav"></nav>
    <div id="shell-page">
      <div class="page">
        <div class="page-header">
          <div>
            <h1>Environment</h1>
            <p>API keys and credentials. Values are never shown once set.</p>
          </div>
        </div>
        <div class="page-body">
          <div class="section">
            <div class="section-title">Add or update a variable</div>
            <form id="env-form" class="form-grid" style="align-items:end;">
              <div class="field">
                <label for="env-key">Key</label>
                <input id="env-key" type="text" placeholder="MY_API_KEY" required />
              </div>
              <div class="field">
                <label for="env-value">Value</label>
                <input id="env-value" type="password" required />
              </div>
              <button type="submit" class="btn primary">Save</button>
            </form>
          </div>
          <table class="data-table">
            <thead>
              <tr><th>Key</th><th>Status</th><th>Description</th><th></th></tr>
            </thead>
            <tbody id="env-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/bots/icons.js"></script>
  <script src="/bots/shell.js"></script>
  <script src="/bots/common.js"></script>
  <script src="/bots/env.js"></script>
</body>
</html>
