[pytest]
# tests/conftest.py imports `backend.main` as a package (see its own
# docstring for why: main.py reads config at import time, so the env has
# to be set up before that first import). Bare `pytest` doesn't add the
# repo root to sys.path on its own -- only `python -m pytest` does, which
# is what worked locally by accident. Declaring it here makes plain
# `pytest tests` work the same way everywhere, CI included.
pythonpath = .
