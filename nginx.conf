server {
    listen 8080;

    # nginx doesn't know it's sitting behind TLS termination + a port
    # remap (Coolify's proxy, then the Cloudflare tunnel) -- left at its
    # default, a bare-path `return`/redirect gets expanded into an
    # absolute URL built from nginx's OWN view of itself
    # (http://host:8080/...), which browsers then try to follow literally
    # and fail. Found live: the redirect below came back as
    # "http://zbots.zaindroid.me:8080/bots/" instead of a path a client
    # could actually use. This sends the bare path instead and lets the
    # client keep its own scheme/host, which is what every proxy hop here
    # already expects.
    absolute_redirect off;

    # The app lives under /bots/, not the site root -- without this, a
    # visitor hitting the bare domain gets nginx's stock "Welcome to
    # nginx!" page (no location / block means requests fall through to
    # nginx's own compiled-in default root), which is a bad first
    # impression for a real product. Found live against the deployed
    # instance -- /bots/ itself always worked fine.
    location = / {
        return 302 /bots/;
    }

    # Liveness for orchestrators -- doesn't touch the backend at all, so it
    # stays fast even if something downstream is unhealthy.
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Real dependency probes and app metadata, unauthenticated -- orchestrator
    # checks, not a human browsing the UI, so no basic-auth gate here.
    location /ready {
        proxy_pass http://127.0.0.1:8643/ready;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://127.0.0.1:8643/version;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8643/openapi.json;
        proxy_set_header Host $host;
    }

    # Static frontend. Real bug found live: no Cache-Control here meant
    # nginx's default (nothing) left every browser to its own heuristic
    # caching for app.js/styles.css/etc -- a real fix would ship, get
    # verified working directly against the server, and a user's own
    # browser would still keep serving the file it fetched before,
    # sometimes for a long while, with zero indication anything was
    # stale. no-cache (NOT no-store) means "always ask the server first"
    # -- the browser still keeps its copy, but revalidates via the
    # ETag/Last-Modified nginx already sends on every load, so an
    # unchanged file is still a fast 304 and a changed one is picked up
    # immediately without a manual hard-refresh.
    location /bots/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/zbots/frontend/;
        try_files $uri $uri/ /bots/index.html;
        add_header Cache-Control "no-cache";
    }

    # Backend API (prefix stripped: /bots-api/roster -> /roster).
    location /bots-api/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        proxy_pass http://127.0.0.1:8643/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 6M;
        # nginx's own default proxy_read_timeout is 60s -- fine for
        # everything else here, but a tool-use chat turn is genuinely two
        # full model completions plus a real tool round-trip, not one, and
        # can legitimately run past a minute. Found live: a real,
        # correctly-answered tool-use turn 504'd at exactly 60.1s even
        # though the backend kept working and produced the right answer --
        # the client just never got to see it. 300s covers a realistic
        # worst case without being unbounded.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded bot avatar images.
    location /bots-avatars/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/data/bots-ui-avatars/;
    }
}
