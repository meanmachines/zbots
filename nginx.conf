server {
    listen 8080;

    # Liveness for orchestrators -- the backend's own /ready (proxied below
    # through /bots-api/ready) is the real dependency probe.
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Static frontend.
    location /bots/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/zbots/frontend/;
        try_files $uri $uri/ /bots/index.html;
    }

    # Backend API (prefix stripped: /bots-api/roster -> /roster).
    location /bots-api/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        proxy_pass http://127.0.0.1:8643/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 6M;
    }

    # Uploaded bot avatar images.
    location /bots-avatars/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/data/bots-ui-avatars/;
    }
}
