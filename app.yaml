name: zbots
memory_mb: 512
port: 8080
domains: []
dependencies: []
database: false
persistent_storage:
  mount_path: /opt/data
env:
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME:
    required: true
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
    required: true
  ZBOTS_MODEL_BASE_URL:
    required: true
  ZBOTS_MODEL_NAME:
    required: true
  ZBOTS_MODEL_API_KEY:
    required: false
  HERMES_DASHBOARD_URL:
    required: false
  HERMES_API_SERVER_URL:
    required: false
  API_SERVER_KEY:
    generate: hex
